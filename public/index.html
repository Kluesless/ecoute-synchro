<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Écoute synchro</title>
<style>
  :root { --bg:#100e1b; --card:#1b1730; --card2:#272145; --txt:#f2efff; --acc:#8b6cff; --acc2:#b39dff; --mut:#9a94b8; --line:#342e57; }
  * { box-sizing: border-box; }
  html, body { margin:0; }
  body { font-family: system-ui, sans-serif; color:var(--txt);
         background: radial-gradient(900px 500px at 8% -10%, rgba(139,108,255,.18), transparent), var(--bg); }
  main { max-width: 1200px; margin: 0 auto; padding: 12px 16px; }
  h1 { font-size: 1.1rem; margin: 4px 0 10px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #me { background:var(--card2); padding:6px 12px; border-radius:20px; font-size:.9rem; white-space:nowrap; margin-bottom:6px; }

  .card { background:var(--card); border:1px solid rgba(255,255,255,.04); border-radius:14px; padding:12px; min-width:0; }
  .head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .head { min-width:0; }
  .head strong { font-size:.95rem; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .head .row { flex:none; }
  /* Carte trop étroite : on garde seulement les emojis sur les boutons */
  #queueCard { container-name:queue; container-type:inline-size; }
  #plCard { container-name:pl; container-type:inline-size; }
  @container queue (max-width: 410px) { #queueCard .lbl { display:none; } }
  @container pl (max-width: 300px) { #plCard .lbl { display:none; } }
  .count { color:var(--mut); font-weight:400; font-size:.85rem; margin-left:4px; }

  input, button { font: inherit; border-radius:10px; border:0; padding:10px 12px; }
  input { background:var(--card2); color:var(--txt); flex:1; min-width:0; }
  input:focus { outline:2px solid var(--acc); outline-offset:0; }
  button { background:var(--acc); color:#fff; cursor:pointer; transition:filter .15s, transform .1s; }
  button:hover { filter:brightness(1.12); }
  button:active { transform:scale(.96); }
  button.ghost { background:var(--card2); }
  .mini.on { background:var(--acc); }
  .mini { display:inline-flex; align-items:center; gap:5px; padding:4px 10px; font-size:.8rem; background:var(--card2); white-space:nowrap; flex:none; }
  .row { display:flex; gap:8px; }

  #player-wrap { position:relative; aspect-ratio:16/9; width:100%; border-radius:12px; overflow:hidden; background:#000;
                 box-shadow:0 10px 30px rgba(0,0,0,.45); }
  #player-wrap iframe, #player-wrap #player { position:absolute; inset:0; width:100%; height:100%; }
  #banner { display:none; margin-top:10px; padding:8px 10px; border-radius:10px; background:#4a2b14; color:#ffd9a8; font-size:.82rem; }
  #nowPlaying { margin-top:10px; font-weight:600; font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .seekrow { display:flex; align-items:center; gap:8px; margin-top:6px; color:var(--mut); font-size:.78rem; }
  .seekrow input[type=range], .vol input[type=range] { padding:0; height:18px; background:none; accent-color:var(--acc); cursor:pointer; flex:1; }
  .seekrow input:focus, .vol input:focus { outline:none; }
  .seekrow span { min-width:36px; text-align:center; font-variant-numeric:tabular-nums; }
  .controls { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; margin-top:8px; }
  .btns { display:flex; gap:8px; }
  .btns button { min-width:54px; }
  #toggle { min-width:64px; }
  .vol { justify-self:end; display:flex; align-items:center; gap:6px; color:var(--mut); }
  .vol input[type=range] { width:90px; flex:none; }
  #status { color:var(--mut); font-size:.75rem; margin-top:8px; text-align:center; }

  ul { list-style:none; padding:0; margin:0; overflow-y:auto; max-height:220px; scrollbar-width:thin; }
  li { display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:8px; cursor:pointer; transition:background .12s; }
  li:hover { background:#241f3d; }
  li.cur { background:var(--card2); box-shadow:inset 3px 0 0 var(--acc); }
  li.dragging { opacity:.4; }
  li.over { box-shadow:inset 0 2px 0 var(--acc); }
  li span.t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li .grip { color:var(--mut); cursor:grab; user-select:none; font-size:.9rem; }
  li small { color:var(--mut); padding:2px 5px; border-radius:6px; }
  li small:hover { color:#fff; background:#3a3360; }

  #layout { display:flex; flex-direction:column; gap:12px; }
  #right { display:flex; flex-direction:column; gap:12px; min-height:0; }

  /* Grand écran : tout tient sans scroll */
  @media (min-width: 820px) and (min-height: 560px) {
    body { height:100vh; overflow:hidden; }
    main { height:100vh; display:flex; flex-direction:column; }
    #layout { flex:1; min-height:0; display:grid; grid-template-columns: minmax(0, 2.2fr) minmax(260px, 1fr); align-items:start; }
    #left, #right { min-width:0; }
    #right { height:100%; }
    #player-wrap { max-height: calc(100vh - 300px); }
    #queueCard { flex:0 1 auto; max-height:42%; min-height:90px; display:flex; flex-direction:column; }
    #plCard { flex:1 1 0; min-height:120px; display:flex; flex-direction:column; }
    #queueCard ul, #plCard ul { flex:1; min-height:0; max-height:none; }
  }

  /* Écran de départ */
  #join { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column;
          align-items:center; justify-content:center; gap:12px; padding:20px; z-index:30; }
  #join h1 { font-size:1.5rem; margin:0; }
  #join .tag { color:var(--mut); margin:0 0 8px; text-align:center; }
  .field { display:flex; flex-direction:column; gap:6px; width:min(320px,100%); }
  .field label { color:var(--mut); font-size:.8rem; text-align:center; }
  #join input { flex:none; width:100%; text-align:center; }
  #joinBtn { padding:10px 28px; }

  /* Chat flottant */
  #chatFab { position:fixed; left:16px; bottom:16px; width:52px; height:52px; border-radius:50%; padding:0;
             font-size:1.4rem; box-shadow:0 6px 20px rgba(0,0,0,.45); z-index:20; }
  #chatBadge { position:absolute; top:-4px; right:-4px; min-width:20px; height:20px; padding:0 5px; border-radius:10px;
               background:#ff5a7a; color:#fff; font-size:.75rem; line-height:20px; text-align:center; display:none; }
  #chatPanel { position:fixed; left:16px; bottom:80px; width:310px; height:min(430px, calc(100vh - 100px));
               background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 34px rgba(0,0,0,.55);
               display:none; flex-direction:column; overflow:hidden; z-index:20; }
  #chatPanel.open { display:flex; animation:pop .15s ease; }
  @keyframes pop { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  #chatHead, #libHead { display:flex; align-items:center; justify-content:space-between; padding:10px 14px;
              background:linear-gradient(90deg, var(--card2), #31285a); font-weight:600; font-size:.95rem; }
  #chatClose, #libClose { background:none; padding:2px 6px; color:var(--mut); font-size:1rem; }
  #chatLog { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:10px; scrollbar-width:thin; }
  .msg { background:var(--card2); padding:6px 10px; border-radius:14px 14px 14px 4px; max-width:86%; word-break:break-word;
         align-self:flex-start; font-size:.9rem; animation:pop .12s ease; }
  .msg .meta { display:flex; align-items:baseline; gap:6px; }
  .msg b { font-size:.78rem; }
  .msg time { color:var(--mut); font-size:.68rem; }
  .msg.mine { align-self:flex-end; background:#3a2f6b; border-radius:14px 14px 4px 14px; }
  .msg.sys { align-self:center; background:none; color:var(--mut); font-size:.75rem; padding:0; }
  .hl { display:flex; align-items:center; gap:12px; }
  .hl button { padding:6px 12px; font-size:.85rem; margin-bottom:6px; }

  /* Bibliothèque de playlists */
  #libPanel { position:fixed; left:16px; top:58px; width:340px; height:min(470px, calc(100vh - 150px));
              background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 34px rgba(0,0,0,.55);
              display:none; flex-direction:column; overflow:hidden; z-index:20; }
  #libPanel.open { display:flex; animation:pop .15s ease; }
  #libList { flex:1; min-height:0; max-height:none; padding:8px; }
  #libList li { cursor:default; flex-wrap:wrap; gap:6px; padding:8px; margin-bottom:4px; background:#221d3b; }
  #libList .info { flex:1; min-width:0; display:flex; flex-direction:column; }
  #libList .info small { padding:0; color:var(--mut); font-size:.72rem; }
  #libList li:hover { background:#2a2447; }
  #libForm { display:flex; flex-direction:column; gap:6px; padding:8px; border-top:1px solid var(--line); }
  #libForm input { padding:8px 10px; font-size:.88rem; }
  #libForm button { padding:8px 12px; }
  #libMsg { color:var(--mut); font-size:.75rem; min-height:1em; }
  #chatForm { display:flex; gap:6px; padding:8px; border-top:1px solid var(--line); }
  #chatForm input { padding:8px 10px; font-size:.9rem; border-radius:18px; }
  #chatForm button { padding:8px 14px; border-radius:18px; }
</style>
</head>
<body>
<div id="join">
  <h1>🎧 Écoute synchro</h1>
  <p class="tag">Même nom de salle = même musique en même temps</p>
  <div class="field">
    <label for="roomInput">Nom de la salle</label>
    <input id="roomInput" placeholder="ex : emma-et-lea">
  </div>
  <button id="joinBtn">Rejoindre</button>
  <div class="field" style="margin-top:28px">
    <label for="pseudoInput">Ton pseudo</label>
    <input id="pseudoInput" placeholder="Ton pseudo" maxlength="20">
  </div>
</div>

<main>
  <header>
    <div class="hl">
      <button class="ghost" id="libBtn" title="Playlists enregistrées">📚 Playlists</button>
      <h1>🎧 Salle : <span id="roomName"></span></h1>
    </div>
    <div id="me">👤 <span id="meName"></span></div>
  </header>

  <div id="layout">
    <section id="left">
      <div class="card">
        <div id="player-wrap"><div id="player"></div></div>
        <div id="banner"></div>
        <div id="nowPlaying">Rien en lecture</div>
        <div class="seekrow">
          <span id="tCur">0:00</span>
          <input type="range" id="seek" min="0" max="1000" value="0">
          <span id="tDur">0:00</span>
        </div>
        <div class="controls">
          <span></span>
          <div class="btns">
            <button class="ghost" id="prev" title="Précédent">⏮</button>
            <button id="toggle" title="Lecture / pause">▶</button>
            <button class="ghost" id="next" title="Suivant">⏭</button>
          </div>
          <div class="vol">🔊<input type="range" id="vol" min="0" max="100" value="100" title="Volume (rien que pour toi)"></div>
        </div>
        <div id="status">Connexion…</div>
      </div>
    </section>

    <section id="right">
      <div class="card">
        <div class="row">
          <input id="link" placeholder="Colle un lien YouTube ou une playlist">
          <button id="add">Ajouter</button>
        </div>
      </div>

      <div class="card" id="queueCard">
        <div class="head">
          <strong>🎶 File d'attente<span class="count" id="queueCount">0</span></strong>
          <span class="row" style="gap:6px">
            <button class="mini" id="autoBtn" title="Quand il n'y a plus rien, lance automatiquement des musiques populaires"><span>🎲</span><span class="lbl" id="autoLbl">Auto : non</span></button>
            <button class="mini" id="shuffleQueue" title="Mélanger les morceaux à venir"><span>🔀</span><span class="lbl">Mélanger</span></button>
          </span>
        </div>
        <ul id="queue"></ul>
      </div>

      <div class="card" id="plCard" style="display:none">
        <div class="head">
          <strong>📃 Playlist en cours</strong>
          <button class="mini" id="shufflePl" title="Mélanger la playlist"><span>🔀</span><span class="lbl">Mélanger</span></button>
        </div>
        <ul id="plList"></ul>
      </div>
    </section>
  </div>
</main>

<button id="chatFab" title="Chat">💬<span id="chatBadge"></span></button>
<div id="chatPanel">
  <div id="chatHead"><span>💬 Chat</span><button id="chatClose" title="Fermer">✕</button></div>
  <div id="chatLog"></div>
  <div id="chatForm">
    <input id="chatInput" placeholder="Écris un message…" maxlength="300">
    <button id="chatSend">➤</button>
  </div>
</div>

<div id="libPanel">
  <div id="libHead"><span>📚 Playlists partagées<span class="count" id="libCount">0</span></span><button id="libClose" title="Fermer">✕</button></div>
  <ul id="libList"></ul>
  <div id="libForm">
    <input id="libLink" placeholder="Colle un lien de playlist YouTube">
    <div class="row">
      <input id="libName" placeholder="Nom (facultatif)" maxlength="100">
      <button id="libSave">Enregistrer</button>
    </div>
    <div id="libMsg"></div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let ws, P, S = null, loaded = null, ready = false, room = '', pseudo = '';
let plIds = [];
let LIB = [];
let unread = 0;
let quietUntil = 0;   // on ignore les évènements du lecteur juste après NOS propres commandes
let lastAct = 0;      // dernière action de l'utilisateur (évite qu'un rappel de synchro l'écrase)
let seeking = false;
let vol = 100;
const titles = {};

const $ = (id) => document.getElementById(id);
const ACT = new Set(['auto', 'play', 'pause', 'seek', 'jump', 'next', 'prev', 'remove', 'move', 'plindex', 'plshuffle', 'shufflequeue', 'add']);
const send = (o) => {
  if (ACT.has(o.type)) lastAct = Date.now();
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(o));
};
const expected = () => (S.playing ? S.pos + (Date.now() - S.recv) / 1000 : S.pos);
const silence = (ms) => { quietUntil = Math.max(quietUntil, Date.now() + ms); };
const keyOf = (it) => it.uid + ':' + (it.ver || 0);
const fmt = (s) => {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};

// ---------- Écran de départ ----------
try {
  $('pseudoInput').value = localStorage.getItem('pseudo') || '';
  $('roomInput').value = localStorage.getItem('room') || '';
  const v = localStorage.getItem('vol');
  if (v !== null && !isNaN(Number(v))) vol = Math.min(100, Math.max(0, Number(v)));
} catch {}
$('vol').value = vol;

$('joinBtn').onclick = () => {
  pseudo = $('pseudoInput').value.trim().slice(0, 20) || 'Anonyme';
  room = $('roomInput').value.trim().toLowerCase() || 'salle';
  try { localStorage.setItem('pseudo', pseudo); localStorage.setItem('room', room); } catch {}
  $('roomName').textContent = room;
  $('meName').textContent = pseudo;
  $('join').style.display = 'none';
  connect();
};
['pseudoInput', 'roomInput'].forEach((id) =>
  $(id).addEventListener('keydown', (e) => e.key === 'Enter' && $('joinBtn').click()));

// ---------- Connexion ----------
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host);
  ws.onopen = () => {
    send({ type: 'join', room, pseudo });
    send({ type: 'libsync', items: myLibLoad() });
    $('status').textContent = 'Connectée ✔';
  };
  ws.onclose = () => { $('status').textContent = 'Déconnectée, reconnexion…'; setTimeout(connect, 2000); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'state') { S = m; S.recv = Date.now(); apply(!!m.tick); }
    else if (m.type === 'chat') addChat(m);
    else if (m.type === 'lib') { LIB = m.items; renderLib(); }
    else if (m.type === 'chat_history') { $('chatLog').innerHTML = ''; m.messages.forEach((x) => addChat(x, true)); }
  };
}

// ---------- Lecteur YouTube ----------
function onYouTubeIframeAPIReady() {
  P = new YT.Player('player', {
    playerVars: { playsinline: 1, rel: 0 },
    events: {
      onReady: () => { ready = true; P.setVolume(vol); apply(false); },
      onStateChange: onPlayerState,
      onError: onPlayerError,
    },
  });
}

// État "officiel" reçu du serveur après une action : on aligne le lecteur dessus
function apply(isTick) {
  if (!ready || !S) return;
  const it = S.queue[S.index];
  if (isTick) return tickSync(it);

  renderQueue();
  renderAuto();
  $('toggle').textContent = S.playing ? '⏸' : '▶';

  if (!it) {
    silence(1000); P.stopVideo(); loaded = null; hidePlaylist(); updateNow();
    return;
  }
  if (it.kind !== 'playlist') hidePlaylist();
  else if (plIds.length) renderPlaylist();
  updateNow();

  const key = keyOf(it);
  if (loaded !== key) {
    // Nouveau morceau : on le charge
    loaded = key;
    plIds = [];
    silence(S.playing ? 4000 : 3500);
    if (it.kind === 'playlist') {
      if (it.order) P.loadPlaylist(it.order, S.pl, expected());
      else P.loadPlaylist({ list: it.id, index: S.pl, startSeconds: expected() });
    } else {
      P.loadVideoById({ videoId: it.id, startSeconds: expected() });
    }
    if (!S.playing) setTimeout(() => { if (S && !S.playing) { silence(1500); P.pauseVideo(); } }, 1200);
    setTimeout(refreshPlaylist, 1500);
    return;
  }

  // Même morceau : on corrige l'index, le temps, puis lecture / pause
  silence(1200);
  if (it.kind === 'playlist' && P.getPlaylistIndex && P.getPlaylistIndex() !== S.pl) {
    P.playVideoAt(S.pl);
  } else if (Math.abs(P.getCurrentTime() - expected()) > 2) {
    P.seekTo(expected(), true);
  }
  const st = P.getPlayerState();
  if (S.playing) {
    if (st !== 1 && st !== 3 && st !== 0) P.playVideo();
  } else if (st === 1 || st === 3) {
    P.pauseVideo();
  }
  setTimeout(refreshPlaylist, 1500);
}

// Rappel régulier du serveur : il ne corrige QUE les décalages de temps.
// Il ne relance jamais une lecture mise en pause et ne change jamais de morceau.
function tickSync(it) {
  if (!S.playing || !it || loaded !== keyOf(it)) return;
  if (Date.now() - lastAct < 2500 || Date.now() < quietUntil) return;
  const st = P.getPlayerState();
  if (st === 1) {
    if (Math.abs(P.getCurrentTime() - expected()) > 2.5) { silence(1500); P.seekTo(expected(), true); }
  } else if (st === -1 || st === 5) {
    silence(1500); P.playVideo();
  }
}

// Ce que fait la personne directement sur le lecteur YouTube
function onPlayerState(e) {
  const st = e.data;
  if (st === YT.PlayerState.PLAYING || st === YT.PlayerState.CUED) refreshPlaylist();
  if (!S) return;
  const it = S.queue[S.index];
  if (!it) return;

  if (st === YT.PlayerState.ENDED) {
    if (it.kind === 'playlist') {
      const ids = (P.getPlaylist && P.getPlaylist()) || plIds;
      const idx = P.getPlaylistIndex ? P.getPlaylistIndex() : -1;
      if (ids && ids.length && idx >= 0 && idx < ids.length - 1) return; // YouTube enchaîne tout seul
    }
    send({ type: 'next', from: S.index }); // jamais ignoré, même juste après une commande
    return;
  }

  if (Date.now() < quietUntil) return; // écho de nos propres commandes
  const t = P.getCurrentTime();

  if (st === YT.PlayerState.PLAYING) {
    if (it.kind === 'playlist') {
      const i = P.getPlaylistIndex();
      if (i >= 0 && i !== S.pl) return send({ type: 'plindex', pl: i });
    }
    banner('');
    if (!S.playing) send({ type: 'play', pos: t });
    else if (Math.abs(t - expected()) > 2) send({ type: 'seek', pos: t });
  } else if (st === YT.PlayerState.PAUSED && S.playing) {
    send({ type: 'pause' });
  }
}

// Message d'avertissement visible sous la vidéo
let bannerTimer = null;
function banner(text) {
  const b = $('banner');
  b.textContent = text;
  b.style.display = text ? 'block' : 'none';
  clearTimeout(bannerTimer);
  if (text) bannerTimer = setTimeout(() => banner(''), 12000);
}

// YouTube refuse de lire quelque chose : on l'affiche clairement, puis on passe à la suite
function onPlayerError(e) {
  const code = e && e.data;
  const why = {
    2: 'lien invalide',
    5: 'erreur du lecteur',
    100: 'introuvable, supprimée ou privée',
    101: 'lecture interdite hors de YouTube par le propriétaire',
    150: 'lecture interdite hors de YouTube par le propriétaire',
  }[code] || ('code ' + code);
  const it = S && S.queue[S.index];
  let name = it ? (it.title || it.id) : '?';
  if (it && it.kind === 'playlist') {
    const ids = (P.getPlaylist && P.getPlaylist()) || plIds;
    const id = ids && ids[P.getPlaylistIndex ? P.getPlaylistIndex() : S.pl];
    name = id && titles[id] ? titles[id] : 'une vidéo de « ' + name + ' »';
  }
  banner('⚠️ Indisponible, on passe à la suite : ' + name + ' (' + why + ')');
  skipUnavailable(0);
}

// Passe automatiquement à la suite quand une musique est indisponible
function skipUnavailable(attempt) {
  if (!S) return;
  const it = S.queue[S.index];
  if (!it) return;
  if (it.kind !== 'playlist') { send({ type: 'next', from: S.index }); return; }

  // On interroge directement le lecteur : la liste peut ne pas être encore connue de la page
  const ids = (P.getPlaylist && P.getPlaylist()) || [];
  const cur = P.getPlaylistIndex ? P.getPlaylistIndex() : -1;
  const i = cur >= 0 ? cur : S.pl;

  if (!ids.length) {
    // Liste pas encore chargée : on réessaie un peu plus tard, puis on abandonne la playlist
    if (attempt >= 3) { send({ type: 'next', from: S.index }); return; }
    const key = keyOf(it), pl0 = S.pl;
    setTimeout(() => {
      const now = S && S.queue[S.index];
      if (now && keyOf(now) === key && S.pl === pl0 && P.getPlayerState() !== 1) skipUnavailable(attempt + 1);
    }, 1000);
    return;
  }
  if (i >= ids.length - 1) send({ type: 'next', from: S.index }); // c'était la dernière piste
  else send({ type: 'plindex', pl: i + 1 });
}

// ---------- Barre de lecture et volume ----------
setInterval(() => {
  if (!ready || !S || seeking) return;
  try {
    const d = P.getDuration ? P.getDuration() : 0;
    const t = P.getCurrentTime ? P.getCurrentTime() : 0;
    $('tCur').textContent = fmt(t);
    $('tDur').textContent = fmt(d);
    $('seek').value = d > 0 ? Math.round((t / d) * 1000) : 0;
  } catch {}
}, 500);

const seekEl = $('seek');
seekEl.addEventListener('pointerdown', () => { seeking = true; });
window.addEventListener('pointerup', () => setTimeout(() => { seeking = false; }, 50));
seekEl.addEventListener('input', () => {
  if (ready) $('tCur').textContent = fmt((seekEl.value / 1000) * P.getDuration());
});
seekEl.addEventListener('change', () => {
  const d = ready ? P.getDuration() : 0;
  if (d > 0) send({ type: 'seek', pos: (seekEl.value / 1000) * d });
  seeking = false;
});

$('vol').addEventListener('input', (e) => {
  vol = Number(e.target.value);
  if (ready) P.setVolume(vol);
  try { localStorage.setItem('vol', String(vol)); } catch {}
});

// ---------- Playlist en cours ----------
function hidePlaylist() { plIds = []; $('plCard').style.display = 'none'; }

function refreshPlaylist() {
  if (!ready || !S) return;
  const it = S.queue[S.index];
  if (!it || it.kind !== 'playlist') return hidePlaylist();
  const ids = P.getPlaylist && P.getPlaylist();
  if (ids && ids.length) {
    if (ids.join() !== plIds.join()) { plIds = ids; loadTitles(); }
    $('plCard').style.display = '';
    renderPlaylist();
  }
}

async function loadTitles() {
  const ids = plIds.slice();
  for (let i = 0; i < ids.length; i += 5) {
    await Promise.all(ids.slice(i, i + 5).map(async (id) => {
      if (titles[id] !== undefined) return;
      try {
        const r = await fetch('https://noembed.com/embed?url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + id));
        titles[id] = (await r.json()).title || '';
      } catch { titles[id] = ''; }
    }));
    if (ids.join() !== plIds.join()) return; // la playlist a changé entre-temps
    renderPlaylist();
  }
}

function renderPlaylist() {
  const ul = $('plList');
  ul.innerHTML = '';
  plIds.forEach((id, i) => {
    const li = document.createElement('li');
    if (S && i === S.pl) li.className = 'cur';
    const span = document.createElement('span');
    span.className = 't';
    span.textContent = (i + 1) + '. ' + (titles[id] || 'Piste ' + (i + 1));
    li.appendChild(span);
    li.onclick = () => send({ type: 'plindex', pl: i });
    ul.appendChild(li);
  });
  updateNow();
}

function updateNow() {
  const it = S && S.queue[S.index];
  let t = 'Rien en lecture';
  if (it) {
    t = it.title || it.id;
    if (it.kind === 'playlist') {
      const id = plIds[S.pl];
      if (id && titles[id]) t = titles[id];
    }
  }
  $('nowPlaying').textContent = t;
}

// ---------- Mode automatique ----------
$('autoBtn').onclick = () => S && send({ type: 'auto', on: !S.auto });
function renderAuto() {
  const on = !!(S && S.auto);
  $('autoLbl').textContent = on ? 'Auto : oui' : 'Auto : non';
  $('autoBtn').classList.toggle('on', on);
}

// ---------- Mélanger ----------
$('shuffleQueue').onclick = () => send({ type: 'shufflequeue' });
$('shufflePl').onclick = () => {
  if (!S || !plIds.length) return;
  const cur = plIds[S.pl];
  const rest = plIds.filter((_, i) => i !== S.pl);
  for (let i = rest.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [rest[i], rest[j]] = [rest[j], rest[i]];
  }
  send({ type: 'plshuffle', order: [cur, ...rest] }); // la vidéo en cours reste en premier
};

// ---------- File d'attente (avec glisser-déposer) ----------
let dragFrom = null;
function renderQueue() {
  const ul = $('queue');
  ul.innerHTML = '';
  $('queueCount').textContent = S.queue.length;
  if (!S.queue.length) {
    ul.innerHTML = '<li style="cursor:default"><span class="t" style="color:var(--mut)">File vide, ajoute un lien !</span></li>';
    return;
  }
  S.queue.forEach((it, i) => {
    const li = document.createElement('li');
    li.draggable = true;
    if (i === S.index) li.className = 'cur';

    const grip = document.createElement('span');
    grip.className = 'grip';
    grip.textContent = '⠿';
    grip.title = 'Glisse pour déplacer';

    const span = document.createElement('span');
    span.className = 't';
    span.textContent = (it.kind === 'playlist' ? '📃 ' : '') + (it.title || it.id);

    const x = document.createElement('small');
    x.textContent = '✕';
    x.title = 'Retirer';
    x.onclick = (e) => { e.stopPropagation(); send({ type: 'remove', index: i }); };

    li.append(grip, span, x);
    li.onclick = () => send({ type: 'jump', index: i });

    li.ondragstart = (e) => {
      dragFrom = i;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(i));
      li.classList.add('dragging');
    };
    li.ondragend = () => {
      dragFrom = null;
      document.querySelectorAll('#queue li').forEach((n) => n.classList.remove('dragging', 'over'));
    };
    li.ondragover = (e) => { e.preventDefault(); li.classList.add('over'); };
    li.ondragleave = () => li.classList.remove('over');
    li.ondrop = (e) => {
      e.preventDefault();
      li.classList.remove('over');
      if (dragFrom !== null && dragFrom !== i) send({ type: 'move', from: dragFrom, to: i });
      dragFrom = null;
    };
    ul.appendChild(li);
  });
}

// ---------- Chat ----------
function colorOf(name) {
  let h = 0;
  for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) % 360;
  return 'hsl(' + h + ' 75% 72%)';
}

function addChat(m, silent) {
  const log = $('chatLog');
  const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  const d = document.createElement('div');
  if (m.system) {
    d.className = 'msg sys';
    d.textContent = m.text;
  } else {
    d.className = 'msg' + (m.pseudo === pseudo ? ' mine' : '');
    const meta = document.createElement('div');
    meta.className = 'meta';
    const b = document.createElement('b');
    b.textContent = m.pseudo;
    b.style.color = colorOf(m.pseudo);
    meta.appendChild(b);
    if (m.ts) {
      const tm = document.createElement('time');
      tm.textContent = new Date(m.ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      meta.appendChild(tm);
    }
    const t = document.createElement('div');
    t.textContent = m.text;
    d.append(meta, t);
  }
  log.appendChild(d);
  while (log.children.length > 100) log.removeChild(log.firstChild);
  if (nearBottom || m.pseudo === pseudo) log.scrollTop = log.scrollHeight;

  // pastille de messages non lus quand le chat est fermé
  if (!silent && !m.system && m.pseudo !== pseudo && !$('chatPanel').classList.contains('open')) {
    unread++;
    $('chatBadge').textContent = unread > 9 ? '9+' : unread;
    $('chatBadge').style.display = 'block';
  }
}

function toggleChat(open) {
  const panel = $('chatPanel');
  const willOpen = typeof open === 'boolean' ? open : !panel.classList.contains('open');
  panel.classList.toggle('open', willOpen);
  if (willOpen) {
    $('libPanel').classList.remove('open');
    unread = 0;
    $('chatBadge').style.display = 'none';
    $('chatLog').scrollTop = $('chatLog').scrollHeight;
    $('chatInput').focus();
  }
}
$('chatFab').onclick = () => toggleChat();
$('chatClose').onclick = () => toggleChat(false);
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { toggleChat(false); toggleLib(false); } });

function sendChat() {
  const text = $('chatInput').value.trim();
  if (!text) return;
  send({ type: 'chat', text });
  $('chatInput').value = '';
}
$('chatSend').onclick = sendChat;
$('chatInput').addEventListener('keydown', (e) => e.key === 'Enter' && sendChat());

// ---------- Bibliothèque de playlists ----------
const myLibLoad = () => {
  try { const a = JSON.parse(localStorage.getItem('myLib') || '[]'); return Array.isArray(a) ? a : []; } catch { return []; }
};
const myLibSave = (a) => { try { localStorage.setItem('myLib', JSON.stringify(a.slice(0, 100))); } catch {} };

let libMsgTimer = null;
function libMsg(text) {
  $('libMsg').textContent = text;
  clearTimeout(libMsgTimer);
  libMsgTimer = setTimeout(() => { $('libMsg').textContent = ''; }, 3000);
}

function renderLib() {
  const ul = $('libList');
  ul.innerHTML = '';
  $('libCount').textContent = LIB.length;
  if (!LIB.length) {
    ul.innerHTML = '<li><span class="t" style="color:var(--mut)">Aucune playlist enregistrée pour l\'instant</span></li>';
    return;
  }
  LIB.forEach((e) => {
    const li = document.createElement('li');

    const info = document.createElement('div');
    info.className = 'info';
    const title = document.createElement('span');
    title.className = 't';
    title.textContent = (e.kind === 'playlist' ? '📃 ' : '▶ ') + e.title;
    title.title = e.title;
    const by = document.createElement('small');
    by.textContent = 'par ' + e.author;
    info.append(title, by);

    const add = document.createElement('button');
    add.className = 'mini';
    add.textContent = '➕';
    add.title = 'Ajouter à la file d\'attente';
    add.onclick = () => { send({ type: 'libplay', id: e.id, now: false }); libMsg('Ajoutée à la file ✔'); };

    const play = document.createElement('button');
    play.className = 'mini';
    play.textContent = '▶ Lancer';
    play.title = 'Lancer maintenant';
    play.onclick = () => { send({ type: 'libplay', id: e.id, now: true }); libMsg('Lancée ✔'); };

    li.append(info, add, play);

    if (e.author === pseudo) {
      const del = document.createElement('small');
      del.textContent = '✕';
      del.title = 'Supprimer mon lien';
      del.style.cursor = 'pointer';
      del.onclick = () => {
        send({ type: 'libdel', id: e.id });
        myLibSave(myLibLoad().filter((x) => !(x.kind === e.kind && x.id === e.ytId)));
      };
      li.appendChild(del);
    }
    ul.appendChild(li);
  });
}

function toggleLib(open) {
  const panel = $('libPanel');
  const willOpen = typeof open === 'boolean' ? open : !panel.classList.contains('open');
  panel.classList.toggle('open', willOpen);
  if (willOpen) { $('chatPanel').classList.remove('open'); renderLib(); }
}
$('libBtn').onclick = () => toggleLib();
$('libClose').onclick = () => toggleLib(false);

$('libSave').onclick = async () => {
  const p = parseLink($('libLink').value.trim());
  if (!p) { libMsg('Lien YouTube non reconnu 🤔'); return; }
  if (LIB.some((x) => x.kind === p.kind && x.ytId === p.id)) { libMsg('Déjà dans la liste ✔'); return; }
  const raw = $('libLink').value.trim();
  let title = $('libName').value.trim();
  $('libLink').value = '';
  $('libName').value = '';
  if (!title) {
    try {
      const r = await fetch('https://noembed.com/embed?url=' + encodeURIComponent(raw));
      title = (await r.json()).title || '';
    } catch {}
  }
  title = title || (p.kind === 'playlist' ? 'Playlist' : 'Vidéo ' + p.id);
  send({ type: 'libadd', kind: p.kind, id: p.id, title });
  const mine = myLibLoad();
  if (!mine.some((x) => x.kind === p.kind && x.id === p.id)) { mine.push({ kind: p.kind, id: p.id, title }); myLibSave(mine); }
  libMsg('Enregistrée ✔');
};
$('libLink').addEventListener('keydown', (e) => e.key === 'Enter' && $('libSave').click());
$('libName').addEventListener('keydown', (e) => e.key === 'Enter' && $('libSave').click());

// ---------- Boutons de lecture ----------
$('toggle').onclick = () => S && send(S.playing ? { type: 'pause' } : { type: 'play' });
$('next').onclick = () => {
  const it = S && S.queue[S.index];
  if (it && it.kind === 'playlist' && plIds.length && S.pl < plIds.length - 1) send({ type: 'plindex', pl: S.pl + 1 });
  else send({ type: 'next' });
};
$('prev').onclick = () => {
  const it = S && S.queue[S.index];
  if (it && it.kind === 'playlist' && S.pl > 0) send({ type: 'plindex', pl: S.pl - 1 });
  else send({ type: 'prev' });
};

// ---------- Ajout d'un lien ----------
function parseLink(url) {
  try {
    const u = new URL(url);
    const list = u.searchParams.get('list');
    // Les "mix" automatiques (RD…) ne se lisent pas : on garde seulement la vidéo
    if (list && !list.startsWith('RD')) return { kind: 'playlist', id: list };
    if (u.hostname.includes('youtu.be')) return { kind: 'video', id: u.pathname.slice(1) };
    const v = u.searchParams.get('v');
    if (v) return { kind: 'video', id: v };
    const m = u.pathname.match(/\/(shorts|embed)\/([\w-]{11})/);
    if (m) return { kind: 'video', id: m[2] };
  } catch {}
  return null;
}

$('add').onclick = async () => {
  const raw = $('link').value.trim();
  const p = parseLink(raw);
  if (!p) { alert('Lien YouTube non reconnu 🤔'); return; }
  $('link').value = '';
  let title = '';
  try {
    const r = await fetch('https://noembed.com/embed?url=' + encodeURIComponent(raw));
    title = (await r.json()).title || '';
  } catch {}
  send({ type: 'add', ...p, title: title || (p.kind === 'playlist' ? 'Playlist' : 'Vidéo ' + p.id) });
};
$('link').addEventListener('keydown', (e) => e.key === 'Enter' && $('add').click());
</script>
